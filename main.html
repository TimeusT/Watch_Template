<!-- HTML Component -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="main.css">
        <title>Watch Template Generator</title>
    </head>
    <body>
        <!-- Buttons + Poster container -->
        <div class="top-row">
            <div class="left-column">
                <div class="inspect-button">
                    <button id="inspect_btn">Inspect</button>
                </div>
                <div class="copy-button">
                    <button id="copy_btn">Copy</button>
                </div>
            </div>

            <div class="poster-column">
                <!-- Poster will be injected here by JS -->
            </div>
        </div>

        <!-- Template display -->
        <p id="template"></p>

        <script src="main.js"></script>
    </body>
</html>
